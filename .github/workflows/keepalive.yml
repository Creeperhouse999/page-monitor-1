name: keepalive

# GitHub disables scheduled workflows after 60 days without repo activity.
# Re-enabling them through the API every week resets that timer (no dummy commits).
on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watch.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sentinel.yml/enable"
          echo "kept alive"
